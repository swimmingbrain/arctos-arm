[project]
name = "arctos-arm"
version = "0.1.0"
description = "Control an Arctos robot arm: MKS servo drivers over CAN, kinematics, simulation, ROS 2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "python-can>=4.4",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "ikpy>=3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arctos"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["ikpy.*", "can.*", "Jetson.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
