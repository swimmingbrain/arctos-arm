[project]
name = "arctos-arm"
version = "0.1.0"
description = "Control an Arctos robot arm: MKS servo drivers over CAN, kinematics, simulation, ROS 2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "python-can>=4.4",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arctos"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
