[project]
name = "arctos-arm"
version = "0.2.0"
description = "Control an Arctos robot arm: MKS servo drivers over CAN, kinematics, simulation, ROS 2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Braian Plaku", email = "braian.plaku@gmail.com" }]
requires-python = ">=3.10"
keywords = ["arctos", "robot arm", "mks servo42d", "mks servo57d", "can", "ros2", "moveit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "python-can>=4.4",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "ikpy>=3.4",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/swimmingbrain/arctos-arm"
Issues = "https://github.com/swimmingbrain/arctos-arm/issues"

[project.scripts]
arctos = "arctos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arctos"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
"src/arctos/cli.py" = ["B008"]  # typer wants the calls in the defaults
"examples/*" = ["ANN", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/", "ros2/", "examples/"]

[[tool.mypy.overrides]]
module = ["ikpy.*", "can.*", "Jetson.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
