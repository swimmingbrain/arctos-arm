# default configuration for an arctos v2 arm with mks servo42d / servo57d drivers.
# everything that has to be adapted to a specific robot lives here, not in code.
# copy it with "arctos init" and edit the copy.
# angles in degrees, lengths in meters, speeds in rpm at the motor.

can:
  interface: slcan          # slcan = canable on usb (serial port), socketcan = can0 on linux
  channel: /dev/ttyACM0     # socketcan: can0, windows: e.g. COM5
  bitrate: 500000
  timeout: 0.5              # seconds to wait for a reply
  send_gap: 0.001           # short pause between two frames, otherwise some get lost

# settings that "arctos setup" writes into the drivers
driver:
  work_mode: 5              # 5 = sr_vfoc: closed loop, controlled over can. this is required,
                            # the factory default 2 (cr_vfoc) is pulse/direction, can moves are ignored

# order = order of the joints from the base to the tool
# the zero offset per joint lives in offsets.yaml, written by "arctos calibrate"
# ratio: motor revolutions per joint revolution (arctos docs)
# invert: true when the motor turns the wrong way (check on the assembled robot).
#         the official ros2_arctos has invert true on all six, treat that as a hint,
#         not as a fact: look at every motor with "arctos motor 1 90"
# speed: default joint speed in degrees per second
# acc: acceleration of the mks driver, 1 = very slow, 255 = very fast, 0 = instant
# current: working current in mA, lower = less force (safety), 42d max 3000, 57d max 5200
joints:
  - name: x
    can_id: 1
    driver: 57d
    ratio: 13.5
    invert: false
    min: -170
    max: 170
    speed: 30
    acc: 60
    current: 2000
  - name: y
    can_id: 2
    driver: 57d
    ratio: 150
    invert: false
    min: -55
    max: 125
    speed: 20
    acc: 60
    current: 2500
  - name: z
    can_id: 3
    driver: 42d
    ratio: 150
    invert: false
    min: -90
    max: 70
    speed: 20
    acc: 60
    current: 1800
  - name: a
    can_id: 4
    driver: 42d
    ratio: 48
    invert: false
    min: -170
    max: 170
    speed: 40
    acc: 80
    current: 1200
  - name: b
    can_id: 5
    driver: 42d
    ratio: 67.82
    invert: false
    min: -88
    max: 88
    speed: 40
    acc: 80
    current: 1000
  - name: c
    can_id: 6
    driver: 42d
    ratio: 67.82
    invert: false
    min: -170
    max: 170
    speed: 40
    acc: 80
    current: 1000

# the wrist b/c of the arctos is a differential: both motors move both joints.
# [motor_b, motor_c] = matrix * [joint_b, joint_c], same sign convention as the arctos ros tools
# if one joint does not move cleanly on its own, swap the signs here.
# without differential (own modification): enabled: false
coupling:
  enabled: true
  matrix: [[-0.5, 0.5], [0.5, 0.5]]

# when moving several joints: all of them arrive together, the slowest axis sets the time
motion:
  tolerance: 0.5            # degrees, from where a joint counts as "arrived"
  max_rpm: 1500             # upper limit at the motor, vfoc can do 3000, we stay below
  min_rpm: 5

# gripper: arduino nano with a servo, listens on can id 7, one byte = servo position
# arctos docs: 0x63 (99) = fully open, 0x00 = fully closed. check on the real gripper.
gripper:
  can_id: 7
  open: 99
  close: 0
  settle: 1.0               # seconds to wait until the servo has settled

# geometry for the kinematics, from the arctos urdf (ros2_arctos, arctos.xacro)
# each line: translation from the previous joint (xyz) and the rotation axis
kinematics:
  links:
    - {name: x, xyz: [0.0, 0.0, 0.1126], axis: [0, 0, 1]}
    - {name: y, xyz: [0.0, -0.020356, 0.175], axis: [1, 0, 0]}
    - {name: z, xyz: [0.0, 0.001365, 0.261035], axis: [1, 0, 0]}
    - {name: a, xyz: [0.0, -0.13881, 0.0217651], axis: [0, 1, 0]}
    - {name: b, xyz: [0.0, -0.12543, -0.00184], axis: [-1, 0, 0]}
    - {name: c, xyz: [0.0, -0.0398, 0.0], axis: [0, 1, 0]}
