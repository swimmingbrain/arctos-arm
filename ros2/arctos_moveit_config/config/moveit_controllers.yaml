# how moveit talks to the robot: two actions offered by arm_node.
# no ros2_control needed, the node executes the path directly over can.
trajectory_execution:
  allowed_execution_duration_scaling: 2.0
  allowed_goal_duration_margin: 2.0
  allowed_start_tolerance: 0.05      # rad, encoders and plan may differ by this much

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory   # -> /arm_controller/follow_joint_trajectory
    default: true
    joints:
      - X_joint
      - Y_joint
      - Z_joint
      - A_joint
      - B_joint
      - C_joint
  gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd               # -> /gripper_controller/gripper_cmd
    default: true
    parallel: true                       # position = sum of both jaws
    joints:
      - Left_jaw_joint
      - Right_jaw_joint
